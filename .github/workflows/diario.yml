name: Agente Auto Diário

on:
  schedule:
    - cron: '0 9 * * *' # Todos os dias às 09:00 UTC
  workflow_dispatch: # Permite correr manualmente no GitHub

jobs:
  executar-agente:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para o bot conseguir gravar o relatório no repositório
    steps:
      - name: Aceder ao repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install google-genai ddgs

      - name: Executar o script do agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python AgenteCronAutos.py

      - name: Registar e enviar relatório atualizado para o GitHub
        run: |
          git config --global user.name "Agente Automático"
          git config --global user.email "agente@bot.local"
          git add relatorio_diario.md
          git commit -m "Atualização automática do relatório diário [skip ci]" || echo "Sem alterações para gravar"
          git push